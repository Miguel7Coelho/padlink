name: Release

# Publishes a GitHub release for the version in pyproject.toml whenever it lands on main
# (merging release/X.Y.Z into main), creating the vX.Y.Z tag automatically.
# Pushing a vX.Y.Z tag by hand, or running it manually, works too.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pyproject.toml version $VERSION"; exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "branch" ]] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the package version matches
        if: steps.version.outputs.skip == 'false'
        run: |
          python - <<'PY'
          import re, tomllib
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"', open("padlink/__init__.py").read()).group(1)
          assert v == init, f"pyproject.toml {v} != padlink/__init__.py {init}"
          assert f"## [{v}]" in open("CHANGELOG.md").read(), f"CHANGELOG.md has no [{v}] section"
          PY

      - name: Run tests
        if: steps.version.outputs.skip == 'false'
        run: python -m pip install pytest && python -m pytest -q

      - name: Build release archive
        if: steps.version.outputs.skip == 'false'
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p dist
          git archive --format=zip --prefix="padlink-${V}/" -o "dist/padlink-${V}.zip" HEAD
          (cd dist && sha256sum ./*.zip > SHA256SUMS)

      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.skip == 'false'
        run: |
          V="${{ steps.version.outputs.version }}"
          awk -v v="$V" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "unzip padlink-${V}.zip && cd padlink-${V}"
            echo "./install.sh"
            echo '```'
            echo
            echo "See the [README](https://github.com/${GITHUB_REPOSITORY}/blob/${{ steps.version.outputs.tag }}/README.md) and [troubleshooting guide](https://github.com/${GITHUB_REPOSITORY}/blob/${{ steps.version.outputs.tag }}/TROUBLESHOOTING.md)."
          } >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.skip == 'false'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: padlink ${{ steps.version.outputs.tag }}
          body_path: notes.md
          make_latest: "true"
          files: |
            dist/*.zip
            dist/SHA256SUMS
