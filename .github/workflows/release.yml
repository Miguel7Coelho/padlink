name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest && python -m pytest -q
      - name: Build release archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive --format=zip --prefix="padlink-${VERSION}/" -o "dist/padlink-${VERSION}.zip" "$GITHUB_REF_NAME"
          (cd dist && sha256sum ./*.zip > SHA256SUMS)
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: padlink ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/*.zip
            dist/SHA256SUMS
