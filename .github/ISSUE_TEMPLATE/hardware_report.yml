name: Hardware / game report
description: Tell us padlink works (or doesn't) with your controller, distro or game
labels: ["hardware-report"]
body:
  - type: input
    id: controller
    attributes:
      label: Controller, firmware and connection
      placeholder: "DualSense, firmware 0x0630, Bluetooth"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and kernel
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: Controller detected (`padlink list`)
        - label: Adaptive triggers
        - label: Light bar / player indicator
        - label: Battery level
        - label: Game detection
        - label: Xbox mode (single Xbox pad in game)
        - label: Rumble in Xbox mode
  - type: textarea
    id: notes
    attributes:
      label: Notes
