name: Feature request
description: Suggest an idea for padlink
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could padlink help?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
